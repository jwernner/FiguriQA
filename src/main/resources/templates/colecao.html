<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/app.css">
    <title>Minha colecao - FiguriQA 2026</title>
</head>
<body>
<nav th:replace="~{fragments :: nav(${user})}"></nav>
<main class="container">
    <h1>Minha colecao</h1>
    <form class="filters" method="get">
        <select name="filtro">
            <option value="todas" th:selected="${filtro == 'todas'}">Todas</option>
            <option value="obtidas" th:selected="${filtro == 'obtidas'}">Obtidas</option>
            <option value="faltantes" th:selected="${filtro == 'faltantes'}">Faltantes</option>
            <option value="repetidas" th:selected="${filtro == 'repetidas'}">Repetidas</option>
        </select>
        <input name="busca" placeholder="Buscar figurinha" th:value="${busca}">
        <button type="submit">Filtrar</button>
    </form>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Codigo</th><th>Titulo</th><th>Status</th><th>Quantidade</th><th>Acao</th></tr></thead>
            <tbody>
            <tr th:each="view : ${stickers}">
                <td th:text="${view.sticker.code}"></td>
                <td th:text="${view.sticker.title}"></td>
                <td><span class="badge" th:text="${view.status}"></span></td>
                <td>
                    <form method="post" action="/colecao/quantidade" class="inline-form">
                        <input type="hidden" name="stickerId" th:value="${view.sticker.id}">
                        <input type="number" name="quantity" th:value="${view.quantity}">
                        <button type="submit">Salvar</button>
                    </form>
                </td>
                <td>
                    <form method="post" action="/colecao/quantidade">
                        <input type="hidden" name="stickerId" th:value="${view.sticker.id}">
                        <input type="hidden" name="quantity" value="0">
                        <button type="submit" class="ghost">Zerar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="/js/app.js"></script>
</body>
</html>
