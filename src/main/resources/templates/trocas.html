<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Propostas')}"></head>
<body class="app-page">
<header th:replace="~{fragments/header :: appHeader(${user})}"></header>
<main class="container">
    <section class="page-hero compact">
        <div><span class="eyebrow">Historico de negociacoes</span><h1>Propostas de troca</h1><p>Acompanhe status, participantes e detalhes das propostas.</p></div>
        <a class="button secondary" href="/trocas/sugestoes">Sugestoes</a>
    </section>
    <section class="trade-list">
        <a class="trade-feed-item rich" th:each="trade : ${trades}" th:href="@{/trocas/{id}(id=${trade.id})}">
            <span class="status-dot" th:classappend="${trade.status.name().toLowerCase()}"></span>
            <div>
                <strong th:text="'Troca #' + ${trade.id}"></strong>
                <small th:text="${trade.requester.name} + ' - ' + ${trade.receiver.name}"></small>
            </div>
            <span th:text="${#temporals.format(trade.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            <span class="status-badge" th:classappend="${trade.status.name().toLowerCase()}" th:text="${trade.status}"></span>
        </a>
    </section>
</main>
<div th:replace="~{fragments/footer :: pwaInstall}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
