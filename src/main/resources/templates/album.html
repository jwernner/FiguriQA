<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Album')}"></head>
<body class="app-page">
<header th:replace="~{fragments/header :: appHeader(${user})}"></header>
<main class="container">
    <section class="page-hero compact">
        <div><span class="eyebrow">Album digital</span><h1>Album</h1><p>Explore as figurinhas ficticias por selecao, raridade e estado de colecao.</p></div>
    </section>
    <form class="filters" method="get">
        <select name="filtro">
            <option value="todas" th:selected="${filtro == 'todas'}">Todas</option>
            <option value="obtidas" th:selected="${filtro == 'obtidas'}">Obtidas</option>
            <option value="faltantes" th:selected="${filtro == 'faltantes'}">Faltantes</option>
            <option value="repetidas" th:selected="${filtro == 'repetidas'}">Repetidas</option>
        </select>
        <input name="busca" placeholder="Buscar por codigo ou titulo" th:value="${busca}">
        <button type="submit">Filtrar</button>
    </form>
    <section class="sticker-grid album-grid">
        <article class="sticker-card" th:each="view : ${stickers}" th:classappend="${view.status + ' ' + view.sticker.rarity.toLowerCase()}">
            <div class="sticker-topline"><span class="sticker-code" th:text="${view.sticker.code}"></span><span class="status-badge" th:text="${view.status}"></span></div>
            <div class="sticker-art pitch-lines"><span th:text="${#strings.substring(view.sticker.team.name,0,1)}">A</span></div>
            <h2 th:text="${view.sticker.title}"></h2>
            <p th:text="${view.sticker.team.name} + ' · Grupo ' + ${view.sticker.team.groupName}"></p>
            <div class="sticker-meta">
                <span th:text="${view.sticker.type}"></span>
                <span th:text="${view.sticker.rarity}"></span>
                <span th:text="'Qtd ' + ${view.quantity}"></span>
            </div>
        </article>
    </section>
</main>
<div th:replace="~{fragments/footer :: pwaInstall}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
