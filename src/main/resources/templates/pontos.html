<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/app.css">
    <title>Pontos de troca - FiguriQA 2026</title>
</head>
<body>
<nav th:replace="~{fragments :: nav(${user})}"></nav>
<main class="container">
    <h1>Pontos de troca</h1>
    <form method="get" class="filters">
        <input name="cidade" placeholder="Filtrar por cidade" th:value="${cidade}">
        <button type="submit">Filtrar</button>
    </form>
    <section class="suggestions">
        <article class="suggestion" th:each="point : ${points}">
            <h2 th:text="${point.name}"></h2>
            <p th:text="${point.address}"></p>
            <span class="badge" th:text="${point.city}"></span>
            <span class="badge" th:text="${point.active ? 'Ativo' : 'Inativo'}"></span>
        </article>
    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
