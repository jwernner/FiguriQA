<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhe da troca')}"></head>
<body class="app-page">
<header th:replace="~{fragments/header :: appHeader(${user})}"></header>
<main class="container">
    <section class="page-hero compact">
        <div><span class="eyebrow">Confirmacao de troca</span><h1 th:text="'Troca #' + ${trade.id}"></h1><p><span th:text="${trade.requester.name}"></span> e <span th:text="${trade.receiver.name}"></span></p></div>
        <span class="status-badge large" th:classappend="${trade.status.name().toLowerCase()}" th:text="${trade.status}"></span>
    </section>
    <section class="trade-detail-grid">
        <article class="panel">
            <h2>Itens da troca</h2>
            <div class="trade-items">
                <div class="trade-item" th:each="item : ${items}">
                    <span class="mini-sticker" th:text="${item.sticker.code}"></span>
                    <div><strong th:text="${item.sticker.title}"></strong><small th:text="${item.direction} + ' · Qtd ' + ${item.quantity}"></small></div>
                </div>
            </div>
        </article>
        <article class="panel confirm-panel">
            <h2>Codigo visual</h2>
            <div class="fake-qr"><span th:text="${trade.confirmationCode}">TRD-000000</span></div>
            <p>Use este codigo para simular a etapa de confirmacao presencial.</p>
        </article>
    </section>
    <section class="panel">
        <div class="actions">
            <form method="post" th:action="@{/trocas/{id}/aceitar(id=${trade.id})}"><button type="submit">Aceitar</button></form>
            <form method="post" th:action="@{/trocas/{id}/cancelar(id=${trade.id})}"><button type="submit" class="danger">Cancelar</button></form>
            <form method="post" th:action="@{/trocas/{id}/concluir(id=${trade.id})}" class="inline-form">
                <input name="confirmationCode" placeholder="Codigo de confirmacao">
                <button type="submit">Concluir</button>
            </form>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: pwaInstall}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
