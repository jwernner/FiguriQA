<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/app.css">
    <title>Detalhe da troca - FiguriQA 2026</title>
</head>
<body>
<nav th:replace="~{fragments :: nav(${user})}"></nav>
<main class="container">
    <h1 th:text="'Troca #' + ${trade.id}"></h1>
    <section class="panel trade-detail">
        <p><strong>Status:</strong> <span class="badge" th:text="${trade.status}"></span></p>
        <p><strong>Participantes:</strong> <span th:text="${trade.requester.name}"></span> e <span th:text="${trade.receiver.name}"></span></p>
        <div class="qr-box">
            <span th:text="${trade.confirmationCode}">TRD-000000</span>
        </div>
        <table>
            <thead><tr><th>Direcao</th><th>Figurinha</th><th>Quantidade</th></tr></thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.direction}"></td>
                <td th:text="${item.sticker.code} + ' - ' + ${item.sticker.title}"></td>
                <td th:text="${item.quantity}"></td>
            </tr>
            </tbody>
        </table>
        <div class="actions">
            <form method="post" th:action="@{/trocas/{id}/aceitar(id=${trade.id})}"><button type="submit">Aceitar</button></form>
            <form method="post" th:action="@{/trocas/{id}/cancelar(id=${trade.id})}"><button type="submit" class="danger">Cancelar</button></form>
            <form method="post" th:action="@{/trocas/{id}/concluir(id=${trade.id})}" class="inline-form">
                <input name="confirmationCode" placeholder="Codigo de confirmacao">
                <button type="submit">Concluir</button>
            </form>
        </div>
    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
