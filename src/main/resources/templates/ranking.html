<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ranking')}"></head>
<body class="app-page">
<header th:replace="~{fragments/header :: appHeader(${user})}"></header>
<main class="container">
    <section class="page-hero compact">
        <div><span class="eyebrow">Liga dos colecionadores</span><h1>Ranking</h1><p>Compare progresso, figurinhas unicas, faltantes e repetidas.</p></div>
        <a class="button secondary" href="/ranking.csv">Exportar CSV</a>
    </section>
    <section class="podium">
        <article th:each="entry, iter : ${ranking}" th:if="${iter.count <= 3}" class="podium-card" th:classappend="'rank-' + ${iter.count}">
            <span class="medal" th:text="${iter.count == 1 ? 'Ouro' : (iter.count == 2 ? 'Prata' : 'Bronze')}"></span>
            <h2 th:text="${entry.user.name}"></h2>
            <strong th:text="${#numbers.formatDecimal(entry.stats.percent, 1, 1)} + '%'"></strong>
            <small th:utext="${entry.user.nickname}"></small>
        </article>
    </section>
    <section class="ranking-list">
        <article class="ranking-row" th:each="entry, iter : ${ranking}">
            <span class="rank-number" th:text="${iter.count}"></span>
            <div><strong th:text="${entry.user.name}"></strong><small th:utext="${entry.user.nickname}"></small></div>
            <span th:text="${#numbers.formatDecimal(entry.stats.percent, 1, 1)} + '%'"></span>
            <span th:text="'Unicas ' + ${entry.stats.unique}"></span>
            <span th:text="'Faltantes ' + ${entry.stats.missing}"></span>
            <span th:text="'Repetidas ' + ${entry.stats.repeated}"></span>
        </article>
    </section>
</main>
<div th:replace="~{fragments/footer :: pwaInstall}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
