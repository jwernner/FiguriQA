services:
  app:
    build: .
    container_name: figuriqa-2026-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/figuriqa
      SPRING_DATASOURCE_USERNAME: figuriqa_user
      SPRING_DATASOURCE_PASSWORD: figuriqa_pass

  db:
    image: postgres:16-alpine
    container_name: figuriqa-2026-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: figuriqa
      POSTGRES_USER: figuriqa_user
      POSTGRES_PASSWORD: figuriqa_pass
    volumes:
      - figuriqa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figuriqa_user -d figuriqa"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  figuriqa_pgdata:
